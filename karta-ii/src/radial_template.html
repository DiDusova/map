<title>Карта ИИ: радар</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ec; --surface:#ffffff; --surface2:#eeebe3; --line:#dcd7cb; --text:#1c1e21; --muted:#5d636b; --faint:#8d929a;
  --accent:#2f5bd3; --ok:#1f7a4d; --ok-soft:#e2f2e9; --warn:#a45f00; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#f9e3e1;
  --ring1:#ffffff; --ring2:#f7f5f0; --hole:#1c1e21; --holetext:#ffffff;
  --shadow:0 1px 2px rgba(20,20,30,.06),0 8px 24px rgba(20,20,30,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --surface:#1c1f23; --surface2:#252a30; --line:#323840; --text:#e9eaec; --muted:#a6acb4; --faint:#79808a;
    --accent:#7fa2ff; --ok:#5fcf93; --ok-soft:#1d3328; --warn:#f0b35a; --warn-soft:#3a2d18; --bad:#ff8a80; --bad-soft:#3d2220;
    --ring1:#1c1f23; --ring2:#181b1f; --hole:#e9eaec; --holetext:#121417; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1c1f23; --surface2:#252a30; --line:#323840; --text:#e9eaec; --muted:#a6acb4; --faint:#79808a;
  --accent:#7fa2ff; --ok:#5fcf93; --ok-soft:#1d3328; --warn:#f0b35a; --warn-soft:#3a2d18; --bad:#ff8a80; --bad-soft:#3d2220;
  --ring1:#1c1f23; --ring2:#181b1f; --hole:#e9eaec; --holetext:#121417; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr);height:100vh}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.search{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;width:220px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;cursor:pointer;font-size:13px;font-weight:600}
.stage{position:relative;overflow:hidden;min-height:0}
svg#radar{width:100%;height:100%;display:block;touch-action:manipulation}
.panel{border-left:1px solid var(--line);background:var(--surface);overflow:auto;min-height:0}
.pin{padding:18px 20px 28px}
.crumbs{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.crumbs button{border:0;background:none;color:var(--accent);padding:0;cursor:pointer;font-size:12px;font-weight:600}
h2{font-size:20px;line-height:1.25;margin:0 0 6px;font-weight:800}
h4{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin:18px 0 8px;font-weight:800}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.legend{display:grid;gap:8px;font-size:13px}
.legend .row{display:flex;align-items:center;gap:10px}
.legend svg{flex:none}
.zlist{display:grid;gap:6px}
.zbtn{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left}
.zbtn:hover{border-color:var(--faint)}
.zbtn i{width:12px;height:12px;border-radius:4px;flex:none}
.zbtn b{font-weight:600;font-size:13px;flex:1}
.zbtn span{font-size:12px;color:var(--muted)}
.mini{display:flex;gap:4px;align-items:flex-end;height:64px;margin:6px 0 2px}
.mini div{flex:1;border-radius:4px 4px 0 0;position:relative;min-height:3px}
.mini-l{display:flex;gap:4px;font-size:11px;color:var(--muted)}
.mini-l span{flex:1;text-align:center}
.lvgroup{margin-top:14px}
.lvhead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;margin-bottom:6px}
.lvtag{font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;background:var(--surface2)}
.item{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:8px;cursor:pointer}
.item:hover,.item.hl{background:var(--surface2)}
.item .t{flex:1;font-size:13px;line-height:1.35}
.item .t small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.ru{font-size:10px;font-weight:800;border-radius:5px;padding:2px 5px;white-space:nowrap;flex:none}
.ru-Д{background:var(--ok-soft);color:var(--ok)} .ru-any{background:var(--surface2);color:var(--text)}
.vb{font-size:11px;font-weight:800;border-radius:6px;padding:3px 8px} .vb-new{background:#6b4fd6;color:#fff} .vb-time{background:var(--ok-soft);color:var(--ok)}
.ba{display:grid;gap:8px;margin:10px 0 4px}.ba div{background:var(--surface2);border-radius:10px;padding:9px 12px;font-size:13.5px}.ba span{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:2px}
.ladder div.best{background:var(--zc);box-shadow:0 0 0 2px var(--text)} .ladder div.on{background:var(--zc);opacity:.45}
.rel{display:flex;flex-wrap:wrap;gap:6px}.rel button{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:5px 9px;font-size:12px;cursor:pointer;text-align:left}
details.more{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}details.more summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)} .ru-VPN{background:var(--warn-soft);color:var(--warn)} .ru-Н{background:var(--bad-soft);color:var(--bad)} .ru-q{background:var(--surface2);color:var(--muted)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:7px 12px;font-size:13px;margin-top:12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.chip{font-size:11px;font-weight:700;border-radius:6px;padding:3px 7px;background:var(--surface2);color:var(--muted)}
.ladder{display:flex;gap:3px;margin:10px 0 4px}
.ladder div{flex:1;height:8px;border-radius:3px;background:var(--surface2)}
.ladder div.on{background:var(--zc)}
.ladder-l{display:flex;gap:3px;font-size:10px;color:var(--muted)}
.ladder-l span{flex:1;text-align:center}
.tip{position:absolute;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;font-weight:600;padding:6px 9px;border-radius:8px;max-width:260px;line-height:1.3;opacity:0;transition:opacity .12s;z-index:5}
.hint{position:absolute;left:16px;bottom:14px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--bg) 85%,transparent);padding:6px 10px;border-radius:8px}
.zoomctl{position:absolute;right:14px;bottom:14px;display:flex;gap:6px}
/* svg */
.sector{cursor:pointer;transition:opacity .25s}
.sector .bgarc{transition:fill-opacity .2s}
.sector:hover .bgarc{fill-opacity:.16}
.dot{cursor:pointer;transition:opacity .2s, r .15s}
.dot.dim{opacity:.12}
.dot.hl{stroke:var(--text)!important;stroke-width:3px}
.zlabel{font-size:18px;font-weight:700;fill:var(--text);cursor:pointer}
.znum{font-size:11px;font-weight:800;fill:#fff}
.rlabel{font-size:13px;font-weight:700;fill:var(--muted)}
.dimz{opacity:.25}
.center{cursor:pointer}
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto min(104vw,72vh) auto;height:auto}
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .search{width:100%;order:5}
  .seg{flex-wrap:nowrap;overflow-x:auto;max-width:100%;min-width:0;flex:0 1 auto;scrollbar-width:none}
  .bar{overflow:hidden}
  .app{max-width:100vw;overflow-x:hidden}
  .seg::-webkit-scrollbar{display:none}
  .brand{width:100%}
  body{overflow-x:hidden}
  .bar{padding:10px 16px}
  .hint{display:none}
}
</style>

<div class="app">
  <div class="bar">
    <div class="brand"><b>Карта возможностей ИИ</b><span>Школа Экзомышления · срез 06.10.2026</span></div>
    <div class="seg" id="view" role="group" aria-label="Вид">
      <button data-v="zones" aria-pressed="true">По зонам</button>
      <button data-v="scen" aria-pressed="false">По сценариям</button>
    </div>
    <div class="seg" id="mode" role="group" aria-label="Подсветка">
      <button data-m="all" aria-pressed="true">Все</button>
      <button data-m="any" aria-pressed="false">Любой чат</button>
      <button data-m="new" aria-pressed="false">Новые возможности</button>
      <button data-m="ru" aria-pressed="false">В РФ без VPN</button>
      <button data-m="pr" aria-pressed="false">Из практики</button>
    </div>
    <input class="search" id="q" type="search" placeholder="Найти: протокол, договор, 1С...">
    <button class="iconbtn" id="theme" type="button">Тема</button>
  </div>
  <div class="stage" id="stage">
    <svg id="radar" viewBox="0 0 1300 1300" role="img" aria-label="Радиальная карта возможностей ИИ"></svg>
    <div class="tip" id="tip"></div>
    <div class="hint">Кольца от центра: уровни усиления У1-У5. Нажмите на зону, точку или выберите сценарий.</div>
  </div>
  <aside class="panel"><div class="pin" id="panel"></div></aside>
</div>
